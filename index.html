    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Serif for Zen headings, Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zen: {
                            bgLight: '#fbf9f5',
                            cardLight: 'rgba(255, 255, 255, 0.65)',
                            bgDark: '#0f172a',
                            cardDark: 'rgba(30, 41, 59, 0.6)',
                            sage: '#84a98c',
                            mist: '#cad2c5',
                            indigo: '#354f52',
                            warmGlow: '#f4a261',
                            amberSoft: '#e9c46a'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 1s ease, color 1s ease;
            overflow-x: hidden;
            user-select: none;
        }

        /* Dynamic Mesh Gradient Background Animation */
        .zen-bg-gradient {
            background: linear-gradient(-45deg, #f7f3eb, #eef4f0, #e8edea, #fdfbf7);
            background-size: 400% 400%;
            animation: gradientShift 25s ease infinite;
        }

        .dark .zen-bg-gradient {
            background: linear-gradient(-45deg, #090d16, #0f172a, #1a2332, #0d131f);
            background-size: 400% 400%;
            animation: gradientShift 25s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Cards */
        .glass-panel {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }

        .dark .glass-panel {
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.4);
        }

        /* Breathing Orb Animation Effect */
        .breathing-orb {
            transition: transform 0.1s linear, box-shadow 1s ease-in-out;
            will-change: transform;
        }

        /* Custom Soft Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(132, 169, 140, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(132, 169, 140, 0.6);
        }

        /* Subtle Fade In Class */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

    <!-- Audio & Canvas Logic -->
    <script>
        /* ----------------------------------------------------
         * 1. Procedural Web Audio API Ambient Sound Generator
         * ---------------------------------------------------- */
        let audioCtx = null;
        const soundNodes = {};

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Generate procedural noise buffers (Rain, Ocean, Brown Noise)
        function createNoiseBuffer(type = 'brown') {
            const bufferSize = audioCtx.sampleRate * 5; // 5 seconds loop
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            let lastOut = 0.0;

            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                if (type === 'brown') {
                    // Brown noise filter algorithm
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 3.5; // Gain compensation
                } else if (type === 'pink') {
                    data[i] = white * 0.5;
                } else {
                    data[i] = white;
                }
            }
            return buffer;
        }

        // Initialize Audio Track Node
        function initSound(type) {
            initAudioContext();
            if (soundNodes[type]) return;

            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.connect(audioCtx.destination);

            if (type === 'space') {
                // Brown noise space generator
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = createNoiseBuffer('brown');
                noiseSource.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(180, audioCtx.currentTime);

                noiseSource.connect(filter);
                filter.connect(gainNode);
                noiseSource.start();

                soundNodes[type] = { source: noiseSource, gain: gainNode, volume: 0 };
            } 
            else if (type === 'rain') {
                // Rain noise synthesizer with bandpass
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = createNoiseBuffer('brown');
                noiseSource.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, audioCtx.currentTime);

                noiseSource.connect(filter);
                filter.connect(gainNode);
                noiseSource.start();

                soundNodes[type] = { source: noiseSource, gain: gainNode, volume: 0 };
            } 
            else if (type === 'ocean') {
                // Ocean waves using modulating lowpass noise
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = createNoiseBuffer('brown');
                noiseSource.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';

                // LFO for ocean tide swell simulation
                const lfo = audioCtx.createOscillator();
                lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime); // 8 sec wave tide cycle
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.setValueAtTime(300, audioCtx.currentTime);

                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                filter.frequency.setValueAtTime(400, audioCtx.currentTime);

                noiseSource.connect(filter);
                filter.connect(gainNode);
                lfo.start();
                noiseSource.start();

                soundNodes[type] = { source: noiseSource, gain: gainNode, volume: 0, lfo: lfo };
            } 
            else if (type === 'bowl') {
                // Tibetan Singing Bowl Harmonic Resonator
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(216, audioCtx.currentTime); // Sacred 216Hz frequency
                osc2.frequency.setValueAtTime(432, audioCtx.currentTime);

                const bowlGain2 = audioCtx.createGain();
                bowlGain2.gain.setValueAtTime(0.3, audioCtx.currentTime);

                osc1.connect(gainNode);
                osc2.connect(bowlGain2);
                bowlGain2.connect(gainNode);

                osc1.start();
                osc2.start();

                soundNodes[type] = { source: osc1, gain: gainNode, volume: 0 };
            }
        }

        function toggleSound(type) {
            initAudioContext();
            const btn = document.getElementById(`btn-${type}`);
            const slider = document.querySelector(`input[oninput*="'${type}'"]`);

            if (!soundNodes[type] || soundNodes[type].volume === 0) {
                adjustVolume(type, 50);
                slider.value = 50;
            } else {
                adjustVolume(type, 0);
                slider.value = 0;
            }
        }

        function adjustVolume(type, val) {
            initAudioContext();
            initSound(type);

            const vol = parseFloat(val) / 100;
            soundNodes[type].volume = vol;
            soundNodes[type].gain.gain.linearRampToValueAtTime(vol * 0.4, audioCtx.currentTime + 0.1);

            document.getElementById(`vol-text-${type}`).innerText = `${Math.round(val)}%`;
            const btn = document.getElementById(`btn-${type}`);

            if (vol > 0) {
                btn.classList.add('bg-zen-sage', 'text-white', 'shadow-sm');
                btn.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-500', 'dark:text-slate-300');
            } else {
                btn.classList.remove('bg-zen-sage', 'text-white', 'shadow-sm');
                btn.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-500', 'dark:text-slate-300');
            }
        }

        function stopAllSounds() {
            Object.keys(soundNodes).forEach(type => {
                adjustVolume(type, 0);
                const slider = document.querySelector(`input[oninput*="'${type}'"]`);
                if (slider) slider.value = 0;
            });
        }


        /* ----------------------------------------------------
         * 2. Interactive Canvas: Water Ripples & Release Particles
         * ---------------------------------------------------- */
        const canvas = document.getElementById('ambientCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const ripples = [];
        const particles = [];

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 2;
                this.maxRadius = Math.random() * 80 + 60;
                this.opacity = 0.6;
                this.speed = 1.2;
            }
            update() {
                this.radius += this.speed;
                this.opacity -= 0.007;
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                const isDark = document.documentElement.classList.contains('dark');
                ctx.strokeStyle = isDark ? `rgba(132, 169, 140, ${this.opacity})` : `rgba(132, 169, 140, ${this.opacity * 0.8})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            }
        }

        class FloatingParticle {
            constructor(x, y, textChar = null) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = -Math.random() * 2 - 0.5; // Float upwards
                this.alpha = 1;
                this.size = Math.random() * 3 + 2;
                this.char = textChar;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.008;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                if (this.char) {
                    ctx.font = '12px "Noto Serif SC"';
                    ctx.fillStyle = '#f4a261';
                    ctx.fillText(this.char, this.x, this.y);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = '#84a98c';
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // Canvas animation frame loop
        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);

            // Update & draw ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].opacity <= 0) ripples.splice(i, 1);
            }

            // Update & draw release particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // Create ripple on background click
        window.addEventListener('click', (e) => {
            // Ignore click if clicking on interactive buttons or textareas
            if (e.target.closest('button, input, textarea, a, .glass-panel')) return;
            ripples.push(new Ripple(e.clientX, e.clientY));
        });


        /* ----------------------------------------------------
         * 3. Mindful Breathing Guide Logic (4-7-8, Box, Calm)
         * ---------------------------------------------------- */
        let breathingState = {
            active: false,
            phaseIndex: 0,
            timer: null,
            pattern: '478'
        };

        const breathPatterns = {
            '478': [
                { name: '吸气 Inhale', duration: 4, scale: 1.25 },
                { name: '屏息 Hold', duration: 7, scale: 1.25 },
                { name: '呼气 Exhale', duration: 8, scale: 0.75 }
            ],
            'box': [
                { name: '吸气 Inhale', duration: 4, scale: 1.25 },
                { name: '屏息 Hold', duration: 4, scale: 1.25 },
                { name: '呼气 Exhale', duration: 4, scale: 0.75 },
                { name: '保持 Rest', duration: 4, scale: 0.75 }
            ],
            'calm': [
                { name: '吸气 Inhale', duration: 5, scale: 1.25 },
                { name: '呼气 Exhale', duration: 5, scale: 0.75 }
            ]
        };

        function setBreathingPattern(preset) {
            breathingState.pattern = preset;
            ['478', 'box', 'calm'].forEach(p => {
                const btn = document.getElementById(`preset-${p}`);
                if (p === preset) {
                    btn.className = "px-3.5 py-1.5 rounded-full text-xs font-medium transition bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-100 shadow-sm";
                } else {
                    btn.className = "px-3.5 py-1.5 rounded-full text-xs font-medium transition text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
                }
            });
            if (breathingState.active) {
                stopBreathing();
                startBreathing();
            }
        }

        function toggleBreathing() {
            if (breathingState.active) {
                stopBreathing();
            } else {
                startBreathing();
            }
        }

        function startBreathing() {
            breathingState.active = true;
            breathingState.phaseIndex = 0;

            document.getElementById('breathControlIcon').className = "fa-solid fa-pause text-[10px] text-amber-500";
            document.getElementById('breathControlText').innerText = "暂停冥想导引";

            runBreathingPhase();
        }

        function stopBreathing() {
            breathingState.active = false;
            clearTimeout(breathingState.timer);

            document.getElementById('breathControlIcon').className = "fa-solid fa-play text-[10px] text-zen-sage";
            document.getElementById('breathControlText').innerText = "开始呼吸导引";
            document.getElementById('breathPhaseText').innerText = "准备静心";
            document.getElementById('breathTimerText').innerText = "点击开启呼吸导引";

            const orb = document.getElementById('breathOrb');
            orb.style.transform = `scale(0.75)`;
            orb.style.transitionDuration = '1s';
        }

        function runBreathingPhase() {
            if (!breathingState.active) return;

            const phases = breathPatterns[breathingState.pattern];
            const currentPhase = phases[breathingState.phaseIndex];

            const orb = document.getElementById('breathOrb');
            const ringOuter = document.getElementById('ringOuter');
            const phaseText = document.getElementById('breathPhaseText');
            const timerText = document.getElementById('breathTimerText');

            phaseText.innerText = currentPhase.name;
            orb.style.transitionDuration = `${currentPhase.duration}s`;
            orb.style.transform = `scale(${currentPhase.scale})`;

            // Ring pulse animation sync
            ringOuter.style.transform = currentPhase.scale > 1 ? 'scale(1.15)' : 'scale(0.85)';

            let count = currentPhase.duration;
            timerText.innerText = `${count} 秒`;

            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0 && breathingState.active) {
                    timerText.innerText = `${count} 秒`;
                } else {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            breathingState.timer = setTimeout(() => {
                if (breathingState.active) {
                    breathingState.phaseIndex = (breathingState.phaseIndex + 1) % phases.length;
                    runBreathingPhase();
                }
            }, currentPhase.duration * 1000);
        }


        /* ----------------------------------------------------
         * 4. Thought Release Dissolution Effect
         * ---------------------------------------------------- */
        function releaseThought() {
            const textarea = document.getElementById('thoughtInput');
            const text = textarea.value.trim();
            if (!text) return;

            const rect = textarea.getBoundingClientRect();
            
            // Generate glowing text floating particles across the input bounds
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const x = rect.left + Math.random() * rect.width;
                const y = rect.top + Math.random() * rect.height;
                particles.push(new FloatingParticle(x, y, char));
            }

            // Extra glowing dust particles
            for (let i = 0; i < 20; i++) {
                const x = rect.left + Math.random() * rect.width;
                const y = rect.top + Math.random() * rect.height;
                particles.push(new FloatingParticle(x, y, null));
            }

            // Clear input gracefully
            textarea.style.transition = "opacity 0.6s ease";
            textarea.style.opacity = "0";

            setTimeout(() => {
                textarea.value = "";
                textarea.style.opacity = "1";
            }, 600);
        }


        /* ----------------------------------------------------
         * 5. Zen Quotes & Fullscreen Ambient Mode
         * ---------------------------------------------------- */
        const zenQuotes = [
            { quote: "“心如明镜台，时时勤拂拭，莫使有尘埃。”", author: "—— 禅语与自然沉思" },
            { quote: "“水深则流缓，人贵在静心。”", author: "—— 静心箴言" },
            { quote: "“林间松风，池上竹影，皆是天地自然之琴瑟。”", author: "—— 菜根谭" },
            { quote: "“放下的那一刻，心中便有了风和日丽。”", author: "—— 宁境心语" },
            { quote: "“万物静观皆自得，四时佳兴与人同。”", author: "—— 程颢" }
        ];

        function refreshQuote() {
            const quoteEl = document.getElementById('zenQuote');
            const authorEl = document.getElementById('zenAuthor');

            quoteEl.style.opacity = '0';
            authorEl.style.opacity = '0';

            setTimeout(() => {
                const random = zenQuotes[Math.floor(Math.random() * zenQuotes.length)];
                quoteEl.innerText = random.quote;
                authorEl.innerText = random.author;
                quoteEl.style.opacity = '1';
                authorEl.style.opacity = '1';
            }, 700);
        }

        // Dark/Light Theme Switching
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon";
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-amber-300";
            }
        }

        // Fullscreen Ambient Mode
        let isZenMode = false;
        function toggleZenMode() {
            isZenMode = !isZenMode;
            const header = document.getElementById('mainHeader');
            const footer = document.getElementById('mainFooter');
            const soundPanel = document.querySelector('.lg\\:col-span-5');
            const exitBtn = document.getElementById('exitZenBtn');

            if (isZenMode) {
                header.classList.add('opacity-0', 'pointer-events-none');
                footer.classList.add('opacity-0', 'pointer-events-none');
                soundPanel.classList.add('opacity-0', 'pointer-events-none', 'hidden');
                exitBtn.classList.remove('hidden');
            } else {
                header.classList.remove('opacity-0', 'pointer-events-none');
                footer.classList.remove('opacity-0', 'pointer-events-none');
                soundPanel.classList.remove('opacity-0', 'pointer-events-none', 'hidden');
                exitBtn.classList.add('hidden');
            }
        }
    </script>
